name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter project
        run: |
          flutter create --no-pub --platforms=android,ios --org com.yurtmenu --project-name yurtmenu "$RUNNER_TEMP/yurtmenu"
          cp main.dart "$RUNNER_TEMP/yurtmenu/lib/main.dart"
          cd "$RUNNER_TEMP/yurtmenu"
          flutter pub add shared_preferences
          rm -f test/widget_test.dart
          sed -i 's/android:label="yurtmenu"/android:label="YurtMenü"/' android/app/src/main/AndroidManifest.xml
          flutter analyze --no-fatal-infos
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: YurtMenu-Android
          path: ${{ runner.temp }}/yurtmenu/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
